
version: 2.1

jobs:
  check-cloud:
    machine: true
    resource_class: large
    steps:
      - run:
          name: Inspect disk
          command: |
            echo "=== CPU ==="
            nproc
            echo "=== RAM ==="
            free -h
            echo "=== DISK ==="
            df -h /
            echo "=== STORAGE ==="
            lsblk

workflows:
  inspect:
    jobs:
      - check-cloud
