name: Custom Android ROM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Free Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Provision Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 python3-pip
          
          sudo curl https://googleapis.com -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Configure Git Credentials
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@github.actions"

      - name: Sync Android Source and Build
        run: |
          mkdir ~/axion && cd ~/axion
          
          repo init -u https://github.com/AxionAOSP/android.git -b lineage-23.2 --depth=1 --git-lfs
          
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/oriole.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="AxionAOSP-devices/android_device_google_gs101" path="device/google/gs101" remote="github" revision="lineage-23.2" clone-depth="1" />
            <project name="AxionAOSP/AxionOS_Pixels" path="device/google/oriole" remote="github" revision="main" clone-depth="1" />
          </manifest>
          EOF
          
          . build/envsetup.sh
          axionSync
          
          axion oriole userdebug gms
          ax -br -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AxionOS-Oriole-Build
          path: ~/axion/out/target/product/oriole/
